on:
  push:
    branches:
      - production
name: 🚀 Deploy production website
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v2
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: pilatesboutique.ie
        username: gitdeploy@pilatesboutique.ie
        password: ${{ secrets.ftp_password }}
        server-dir: wp-content/themes/pilates-boutique/
        exclude: |
          **/node_modules/**
          package-lock.json
          package.json
          README.md
